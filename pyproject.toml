[project]
name = "murinecyto-det"
version = "0.1.0"
description = "MurineCyto-Det: mouse-level benchmark for murine BAL cytology segmentation and detection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "segmentation-models-pytorch>=0.5.0",
    "albumentations>=2.0.8",
    "matplotlib>=3.10.9",
    "pandas>=3.0.2",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torchmetrics>=1.9.0",
    "pycocotools>=2.0.10",
    "tqdm>=4.67.3",
    "huggingface-hub>=1.12.0",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "tensorboard>=2.20.0",
    "opencv-python>=4.13.0.92",
    "ultralytics>=8.3.0",
]


[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true


[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  ]
